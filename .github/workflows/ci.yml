name: Verificación de tareas
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        proyecto: [tareas-back-main, tareas-fe]
    defaults:
      run:
        working-directory: tareas-2/${{ matrix.proyecto }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.13.0'
      - run: pnpm install --frozen-lockfile
      - if: matrix.proyecto == 'tareas-back-main'
        run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run lint
      - if: matrix.proyecto == 'tareas-fe'
        run: pnpm run build
      - if: matrix.proyecto == 'tareas-back-main'
        run: pnpm run test:production

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.13.0'
      - run: pnpm --dir tareas-2/tareas-back-main install --frozen-lockfile
      - run: pnpm --dir tareas-2/tareas-fe install --frozen-lockfile
      - run: pnpm --dir tareas-2/tareas-fe exec playwright install --with-deps chromium
      - run: pnpm --dir tareas-2/tareas-fe run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tareas-2/tareas-fe/playwright-report/
          retention-days: 7
